<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Lumen Pit is a black infinite arena. Drift with WASD, aim with the cursor, collect orbs, and pick an upgrade each time the bar fills."
    />
    <title>Lumen Pit</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-hidden="true"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="frame" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <div id="xp" class="xp" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" aria-label="Experience">
      <div id="xp-fill" class="xp-fill"></div>
      <span id="xp-label" class="xp-label">Lv 1</span>
    </div>
    <header id="hud">
      <p class="label">Health</p>
      <div id="hull" class="hull" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="8" aria-valuenow="8">
        <div id="hull-fill" class="hull-fill"></div>
      </div>
    </header>
    <div class="tools">
      <button id="fast" type="button" aria-pressed="false">Fast</button>
      <button id="mute" type="button" aria-pressed="true">Audio on</button>
      <button id="full" type="button" aria-pressed="false">Full screen</button>
    </div>
    <p id="hint" class="hint">WASD drifts · cursor aims · orbs fill the bar</p>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <div id="level" class="level" hidden>
      <div class="level-card" role="dialog" aria-modal="true" aria-labelledby="level-title">
        <p id="level-kicker" class="label">Level 2</p>
        <h2 id="level-title">Choose an upgrade</h2>
        <div id="offers" class="offers"></div>
      </div>
    </div>
    <div id="overlay" hidden>
      <div class="card">
        <h1>Core lost</h1>
        <p id="final" class="final"></p>
        <ul id="damage" class="damage" aria-label="Damage dealt"></ul>
        <div class="end-actions">
          <button id="advanced" type="button">Advanced</button>
          <button id="again" type="button">Reform</button>
        </div>
        <p class="sub">Press R</p>
      </div>
    </div>
    <div id="timeline" class="timeline" hidden>
      <div class="timeline-window" role="dialog" aria-modal="true" aria-labelledby="timeline-title">
        <header class="timeline-head">
          <div>
            <p class="label">Advanced</p>
            <h2 id="timeline-title">Damage timeline</h2>
          </div>
          <button id="timeline-close" type="button">Close</button>
        </header>
        <p class="timeline-note">Each curve is one weapon’s damage. Diamonds mark an upgrade. The dashed curve is the total.</p>
        <canvas id="timeline-chart" aria-label="Damage dealt over time"></canvas>
        <ul id="timeline-legend" class="timeline-legend"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
